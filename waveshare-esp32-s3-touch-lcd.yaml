################################################################################
# Substitution Variables
################################################################################
substitutions:
  device_internal_name: esphome_19
  device_wifi_name: esphome_19
  device_friendly_name: ESPHome 19
  device_ip_address: 192.168.200.46
  device_sampling_time: 30s

#   glyphs
#  lightbulb_on:      "\U000F0335"
#  lightbulb_off:     "\U000F0336"


################################################################################
# Globals
################################################################################
globals: ##to set default reboot behavior
  - id: wifi_connection
    type: bool
    restore_value: no
    initial_value: "false"
################################################################################
# Scripts für Auto-Off und Touch-Wakeup
################################################################################
script:
  - id: display_timer
    mode: restart
    then:
      - delay: !lambda "return id(display_timeout_setting).state * 1000;"
      - switch.turn_off: lcdbacklight
      - lambda: 'id(rwv).disable_touch(true);'

  - id: wake_up_display
    mode: single
    then:
      - if:
          condition:
            - switch.is_off: lcdbacklight
          then:
            - switch.turn_on: lcdbacklight
            - lambda: 'id(rwv).disable_touch(false);'
            - delay: 500ms
      - script.execute: display_timer
        
################################################################################
# Board Configuration
################################################################################
esphome:
  name: ${device_internal_name}
  friendly_name: ${device_friendly_name}
  build_flags: "-DBOARD_HAS_PSRAM"
  platformio_options:
    board_upload.maximum_ram_size: 524288
    platform_packages:
      - framework-espidf@https://github.com

external_components:
  - source: github://strange-v/RemoteWebViewClient@main
    refresh: 0s
    components: [ remote_webview ]

psram:
  mode: octal
  speed: 80MHz

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf
    components:
      - name: "espressif/esp_websocket_client"
        ref: "1.5.0"
      - name: "bitbank2/jpegdec"
        source: "https://github.com/strange-v/jpegdec-esphome"
    sdkconfig_options:
      CONFIG_BOOTLOADER_FLASH_DC_AWARE: "n"
      CONFIG_SPI_FLASH_HPM_DC_DISABLE: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESPTOOLPY_FLASHSIZE_8MB: "y"
      CONFIG_FREERTOS_HZ: "1000"
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: y
      CONFIG_COMPILER_OPTIMIZATION_SIZE: "y"
mdns:
  disabled: true         # Schaltet die fehlerhafte Komponente komplett ab
  
################################################################################
# Enable logging
################################################################################
logger:
  logs:
    component: ERROR

################################################################################
# Enable Home Assistant API
################################################################################
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_encryption_key
    

################################################################################
# OTA
################################################################################
ota:
  platform: esphome
  password: !secret web_server_password

################################################################################
# WiFi
################################################################################
wifi:
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password
  output_power: 14dB     # Begrenzt Peak-Ströme und mindert Funkstörungen
  fast_connect: true     # Verhindert den speicherintensiven Komplettscan vor dem Verbinden
  reboot_timeout: 30min
  manual_ip:
    static_ip: ${device_ip_address}
    gateway: !secret gateway_address
    subnet: !secret subnet_address

  ap:
    # ssid: ${device_wifi_name}
    password: !secret web_server_password

captive_portal:

################################################################################
# Web Server
################################################################################
web_server:
  port: 80
  version: 3
  include_internal: true
  auth:
    username: !secret web_server_user
    password: !secret web_server_password
  local: true

################################################################################
# IO Extender
################################################################################
ch422g:
  - id: ch422g_hub
    

################################################################################
# Switch
################################################################################
switch:
  - platform: restart
    name: "Restart"
    id: device_restart
  
  - platform: safe_mode
    name: Use Safe Mode
    id: device_safe_mode
    
  - platform: gpio
    id: lcdbacklight
    name: lcdbacklight
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

################################################################################
# Sensors
################################################################################
sensor:
  # WiFi
  - platform: wifi_signal
    name: "WiFi Signal Sensor"
    id: ${device_internal_name}_wifi_signal_sensor
    update_interval: 10s

################################################################################
# Text Sensors
################################################################################
number:
  - platform: template
    name: "Display Standby Zeit"
    id: display_timeout_setting
    min_value: 10
    max_value: 300
    step: 5
    initial_value: 60
    optimistic: true

color:
  - id: my_red
    red: 100%
    green: 0%
    blue: 0%
  - id: my_pink
    red: 100%
    green: 10%
    blue: 40%
  - id: my_yellow
    red: 100%
    green: 100%
    blue: 0%
  - id: my_green
    red: 0%
    green: 100%
    blue: 0%
  - id: my_blue
    red: 0%
    green: 0%
    blue: 100%
  - id: my_gray
    red: 50%
    green: 50%
    blue: 50%
  - id: my_white
    red: 100%
    green: 100%
    blue: 100%
  - id: my_black
    red: 0%
    green: 0%
    blue: 0%

font:
  - file: "fonts/arial.ttf"
    id: arial_98
    size: 98
  - file: "fonts/arial.ttf"
    id: arial_96
    size: 96
  - file: "fonts/arial.ttf"
    id: arial_134
    size: 134
  - file: "fonts/arial.ttf"
    id: arial_128
    size: 128
  - file: "fonts/arial.ttf"
    id: arial_48
    size: 48
  - file: "fonts/arial.ttf"
    id: arial_36
    size: 36
  - file: "fonts/arial.ttf"
    id: arial_24
    size: 24
  - file: "fonts/arial.ttf"
    id: arial_18
    size: 18
  - file: "fonts/arial.ttf"
    id: arial_12
    size: 12
  - file: "gfonts://Roboto"
    id: roboto10
    size: 10
    bpp: 4
  - file: "fonts/materialdesignicons-webfont.ttf"
    id: mdi_42
    size: 42
    bpp: 4
#    glyphs: [
#      "$lightbulb_on", 
#      "$lightbulb_off", 
#      ]


############################################ START OF VLGL

### Remote WebView Empfänger
remote_webview:
  id: rwv
  display_id: my_display      
  touchscreen_id: my_touch    
  server: 192.168.200.20:8081 
  url: http://192.168.200.20:80/dashboard-heizraum/0?kiosk
  full_frame_tile_count: 1
  max_bytes_per_msg: 61440
  jpeg_quality: 85
  hw_decode: false            
  hw_decode_timeout_ms: 200

  current_url_sensor:
    name: "Remote Display Current URL"


i2c:
  sda: GPIO08
  scl: GPIO09
  scan: True
  id: bus_a

# Define display
display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 16
    vsync_front_porch: 16
    vsync_pulse_width: 4
    data_pins:
      red:
        - 1         #r3
        - 2         #r4
        - 42        #r5
        - 41        #r6
        - 40        #r7
      blue:
        - 14        #b3
        - 38        #b4
        - 18        #b5
        - 17        #b6
        - 10        #b7
      green:
        - 39        #g2
        - 0         #g3
        - 45        #g4
        - 48        #g5
        - 47        #g6
        - 21        #g7

touchscreen:
  platform: gt911
  id: my_touch
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  on_touch:
    - lambda: |-
        ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
    # KORREKTUR: Fehlenden Skriptaufruf für das Aufwachen wieder hinzugefügt
    - script.execute: wake_up_display
  on_update:
    - lambda: |-
          for (auto touch: touches)  {
              if (touch.state <= 2) {
                ESP_LOGI("Touch points:", "id=%d x=%d, y=%d x.raw=%d, y.raw=%d", touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
              }
          }  
